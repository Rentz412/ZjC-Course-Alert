name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · Test · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # 动态检查 release 签名密钥：若已配置则注入正式签名，未配置则优雅降级为 debug 签名兜底打包，不阻断 CI
      - name: Set up release signing (Optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "检测到云端签名证书，正在配置正式 release 签名..."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=${KEYSTORE_PASSWORD}"
              echo "keyAlias=${KEY_ALIAS}"
              echo "keyPassword=${KEY_PASSWORD}"
            } > keystore.properties
          else
            echo "未检测到 KEYSTORE_BASE64，本次构建将使用默认 debug 证书完成 release 打包（适合体验与预览包）。"
          fi

      - name: Build, test and lint
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest --stacktrace --console=plain

      # 收集打包产物并重命名为 ZjC-Course-Alert
      - name: Collect APKs
        if: success()
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p apk-out
          cp app/build/outputs/apk/debug/*.apk "apk-out/ZjC-Course-Alert-v${version}-debug.apk"
          cp app/build/outputs/apk/release/*.apk "apk-out/ZjC-Course-Alert-v${version}-release.apk"

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZjC-Course-Alert-v${{ env.VERSION }}
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 14

      # 打 v* tag 推送时自动创建 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" || true
          NOTES=$(git cat-file tag "$GITHUB_REF_NAME" | sed -e '1,/^$/d' || true)
          if [ -z "$NOTES" ]; then
            NOTES="华珠课表发布版本 $GITHUB_REF_NAME"
          fi
          gh release create "$GITHUB_REF_NAME" apk-out/*.apk \
            --title "华珠课表 $GITHUB_REF_NAME" \
            --notes "$NOTES"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
